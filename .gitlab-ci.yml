image: python:buster

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:
  script:
  - pip install pystache
  - pip install Markdown
  - pip install pyyaml
  - ./recept.py generate --input content
  except:
  - master

pages:
  script:
  - pip install pystache
  - pip install Markdown
  - pip install pyyaml
  - ./recept.py generate --input content
  - ls -a
  artifacts:
    paths:
    - generated
  only:
  - master
